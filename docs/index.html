<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Analysis Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Tkxel Theme */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #004080; /* Tkxel primary color */
        }

        #container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Beautified Textarea */
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #004080;
            box-shadow: 0px 0px 5px rgba(0, 64, 128, 0.5);
        }

        button {
            background-color: #004080;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #003366;
        }

        /* Loader */
        #loader {
            display: none;
            margin-top: 10px;
            font-size: 16px;
            color: #004080;
        }

        /* Output Styling */
        #output {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Requirement Analysis Agent</h1>
    <div id="container">
        <textarea id="projectDescription" placeholder="Enter project description..." rows="4"></textarea>
        <button onclick="analyzeProject()">Analyze</button>
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Processing...</div>
        <div id="output"></div>
    </div>

    <script>
        async function analyzeProject() {
            const projectDescription = document.getElementById("projectDescription").value;
            const outputElement = document.getElementById("output");
            const loaderElement = document.getElementById("loader");

            // Clear previous results
            if (outputElement) outputElement.innerHTML = "";

            // Validate input
            if (!projectDescription.trim()) {
                alert("Please enter a project description.");
                return;
            }

            // Show loader
            if (loaderElement) loaderElement.style.display = "block";

            try {
                const response = await fetch("https://requirement-agent-production.up.railway.app/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ project_description: projectDescription }),
                });

                if (!response.ok) throw new Error("Network response was not ok");

                const result = await response.json();

                // Hide loader
                if (loaderElement) loaderElement.style.display = "none";

                // Display results
                if (outputElement) {
                    outputElement.innerHTML = formatResponse(result);
                }

            } catch (error) {
                console.error("Error:", error);
                if (loaderElement) loaderElement.style.display = "none";
                if (outputElement) outputElement.innerHTML = `<p style="color: red;">Failed to fetch results.</p>`;
            }
        }

        function formatResponse(data) {
            let formatted = "<h2>Analysis Result:</h2>";
            for (const key in data) {
                if (Array.isArray(data[key])) {
                    formatted += `<strong>${formatKey(key)}:</strong><ul>`;
                    data[key].forEach(item => {
                        formatted += `<li>${typeof item === "object" ? formatObject(item) : item}</li>`;
                    });
                    formatted += "</ul>";
                } else if (typeof data[key] === "object") {
                    formatted += `<strong>${formatKey(key)}:</strong>${formatCostTable(key, data[key])}<br>`;
                } else {
                    formatted += `<strong>${formatKey(key)}:</strong> ${data[key]}<br>`;
                }
            }
            return formatted;
        }

        function formatKey(key) {
            return key.replace(/_/g, " ").toUpperCase();
        }

        function formatObject(obj) {
            return `<table border="1" style="border-collapse: collapse; width: 100%; margin-top: 5px;">
                ${Object.entries(obj).map(([k, v]) => `
                    <tr>
                        <td style="padding: 5px;"><strong>${formatKey(k)}</strong></td>
                        <td style="padding: 5px;">${v}</td>
                    </tr>`).join("")}
            </table>`;
        }

        // ✅ **Fix Cost Estimation Object Rendering**
        function formatCostTable(title, costObj) {
            let html = `<table border="1" style="border-collapse: collapse; width: 100%; margin-top: 5px;">
                <tr><th colspan="3" style="background:#004080; color:white; padding:5px;">${formatKey(title)}</th></tr>
                <tr><th>Category</th><th>Estimated Hours</th><th>Hourly Rate</th><th>Subtotal</th></tr>`;

            for (const key in costObj) {
                if (typeof costObj[key] === "object") {
                    html += `<tr>
                                <td style="padding:5px;"><strong>${formatKey(key)}</strong></td>
                                <td style="padding:5px;">${costObj[key].estimated_hours || "N/A"}</td>
                                <td style="padding:5px;">${costObj[key].hourly_rate || "N/A"}</td>
                                <td style="padding:5px;">${costObj[key].subtotal || "N/A"}</td>
                            </tr>`;
                } else {
                    html += `<tr>
                                <td colspan="4" style="padding:5px;"><strong>${formatKey(key)}</strong>: ${costObj[key]}</td>
                            </tr>`;
                }
            }

            html += "</table>";
            return html;
}

    </script>
</body>
</html>
