<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Analysis Agent</title>
    <style>
        /* Tkxel Branding Colors */
        :root {
            --primary-color: #FF5733;
            --secondary-color: #333333;
            --accent-color: #FFFFFF;
            --bg-color: #F4F4F4;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: var(--secondary-color);
            color: var(--accent-color);
        }

        .header img {
            height: 50px;
            margin-right: 10px;
        }

        h1 {
            font-size: 22px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--secondary-color);
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: var(--primary-color);
            color: var(--accent-color);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }

        .response {
            text-align: left;
            margin-top: 20px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 5px;
        }

        .response ul {
            list-style-type: none;
            padding: 0;
        }

        .response li {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <!-- Header with Logo -->
    <div class="header">
        <img src="https://tkxel.com/assets/tkxel-logo.svg" alt="Tkxel Logo">
        <h1>Requirement Analysis Agent</h1>
    </div>

    <div class="container">
        <label for="projectDesc">Enter Project Description:</label>
        <input type="text" id="projectDesc" placeholder="Describe your project...">
        <button onclick="analyzeProject()">Analyze</button>

        <!-- Response Display -->
        <div class="response" id="responseContainer" style="display: none;">
            <h3>Analysis Result:</h3>
            <ul id="resultList"></ul>
        </div>
    </div>

    <script>
        async function analyzeProject() {
            const projectDescription = document.getElementById("projectDesc").value;
            const responseContainer = document.getElementById("responseContainer");
            const resultList = document.getElementById("resultList");
            const loader = document.getElementById("loader"); // Loader Element

            if (!projectDescription) {
                alert("Please enter a project description!");
                return;
            }

            // Show the loader and clear previous results
            loader.style.display = "block";
            responseContainer.style.display = "none";
            resultList.innerHTML = "";

            try {
                const response = await fetch("https://requirement-agent-production.up.railway.app/analyze", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ project_description: projectDescription })
                });

                if (!response.ok) {
                    throw new Error("Server error, please try again!");
                }

                const data = await response.json();
                resultList.innerHTML = "";

                // Function to process nested objects and arrays
                function parseValue(key, value) {
                    if (Array.isArray(value)) {
                        return `<strong>${key}:</strong><ul>${value.map(item => 
                            typeof item === "object" ? `<li>${JSON.stringify(item, null, 2)}</li>` : `<li>${item}</li>`
                        ).join('')}</ul>`;
                    } else if (typeof value === "object" && value !== null) {
                        return `<strong>${key}:</strong><ul>${Object.entries(value).map(([subKey, subValue]) =>
                            `<li><strong>${subKey}:</strong> ${JSON.stringify(subValue, null, 2)}</li>`
                        ).join('')}</ul>`;
                    } else {
                        return `<strong>${key}:</strong> ${value}`;
                    }
                }

                // Convert JSON response into a readable format
                for (const [key, value] of Object.entries(data)) {
                    const listItem = document.createElement("li");
                    listItem.innerHTML = parseValue(key, value);
                    resultList.appendChild(listItem);
                }

                // Hide the loader and show results
                loader.style.display = "none";
                responseContainer.style.display = "block";
            } catch (error) {
                resultList.innerHTML = `<li style="color: red;">Error: ${error.message}</li>`;
                loader.style.display = "none";
            }
        }


    </script>
    <p id="loader" style="display: none; font-weight: bold; text-align: center; color: #ff6600;">
        🔄 Fetching results... Please wait.
    </p>
    
</body>
</html>
