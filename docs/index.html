<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Agent</title>
    <script>
        async function analyzeProject() {
            const projectDescription = document.getElementById("description").value;
            const response = await fetch("https://requirement-agent.up.railway.app/analyze", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ project_description: projectDescription })
            });
            const result = await response.json();
            document.getElementById("output").innerText = JSON.stringify(result, null, 2);
        }
    </script>
</head>
<body>
    <h2>Requirement Analysis</h2>
    <textarea id="description" rows="4" cols="50" placeholder="Enter project description..."></textarea><br>
    <button onclick="analyzeProject()">Analyze</button>
    <h3>Output:</h3>
    <pre id="output"></pre>
</body>
</html>
